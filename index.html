function genMath(lvl) {
  let a, b, q, ans;
  const alt = Math.random() < 0.3 ? rand(2) : -1;
  if (alt === 0) { const m = [10, 30, 60][lvl - 1]; a = 1 + rand(m); b = 1 + rand(m); q = `${a} + ? = ${a + b}`; ans = b; }
  else if (alt === 1) { const d = [1 + rand(3), 2 + rand(9), 5 + rand(21)][lvl - 1], s0 = 1 + rand(lvl * 10); q = `${s0}, ${s0 + d}, ${s0 + 2 * d}, ?`; ans = s0 + 3 * d; }
  else if (lvl === 1) {
    a = 1 + rand(10); b = 1 + rand(10);
    if (rand(2)) { q = `${a} + ${b}`; ans = a + b; }
    else { const hi = Math.max(a, b), lo = Math.min(a, b); q = `${hi} − ${lo}`; ans = hi - lo; }
  } else if (lvl === 2) {
    const op = rand(3);
    if (op === 0) { a = 10 + rand(40); b = 5 + rand(40); q = `${a} + ${b}`; ans = a + b; }
    else if (op === 1) { a = 20 + rand(30); b = 1 + rand(19); q = `${a} − ${b}`; ans = a - b; }
    else { a = 2 + rand(9); b = 2 + rand(9); q = `${a} × ${b}`; ans = a * b; }
  } else {
    const op = rand(3);
    if (op === 0) { a = 3 + rand(10); b = 3 + rand(10); q = `${a} × ${b}`; ans = a * b; }
    else if (op === 1) { b = 2 + rand(10); ans = 2 + rand(11); a = b * ans; q = `${a} ÷ ${b}`; }
    else { a = 40 + rand(60); b = 20 + rand(60); q = `${a} + ${b}`; ans = a + b; }
  }
  const spread = lvl === 1 ? 3 : lvl === 2 ? 6 : 10;
  const w = new Set();
  while (w.size < 2) { const v = ans + rand(spread * 2 + 1) - spread; if (v !== ans && v >= 0) w.add(v); }
  return { q: alt >= 0 ? q : q + ' = ?', ans: String(ans), wrong: [...w].map(String) };
}

function makeQ() {
  let r;
  for (let tries = 0; tries < 15; tries++) {
    const cat = sel.cat === 'mixed' ? ['math','filipino','english','science','ph'][rand(5)] : sel.cat;
    const pool = cat === 'math' ? [] : BANK.filter(e => e[0] === cat && e[1] === sel.lvl);
    if (!pool.length) r = genMath(sel.lvl);
    else { const e = pool[rand(pool.length)]; r = { q: e[2], ans: e[3], wrong: [e[4], e[5]] }; }
    if (!recent.includes(r.q)) break;
  }
  recent.push(r.q); if (recent.length > 30) recent.shift();
  const opts = shuffle([r.ans, ...r.wrong]);
  return { q: r.q, ans: r.ans, opts, idx: opts.indexOf(r.ans) };
}

let AC = null, master = null, muted = localStorage.getItem('qr_mute') === '1', musicTimer = null, mi = 0;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 1; master.connect(AC.destination);
  } catch (e) {}
}
function toggleMute() {
  muted = !muted; try { localStorage.setItem('qr_mute', muted ? '1' : '0'); } catch (e) {}
  audioInit(); if (master) master.gain.value = muted ? 0 : 1;
}
function tone(f, d, type, vol, f2, delay) {
  if (!AC) return;
  const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(vol || 0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.02);
}
function sfx(n) {
  ({
    jump: () => tone(300, 0.18, 'square', 0.1, 600),
    slide: () => tone(400, 0.2, 'sawtooth', 0.08, 150),
    coin: () => { tone(988, 0.08, 'square', 0.1); tone(1319, 0.15, 'square', 0.1, 0, 0.07); },
    power: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'triangle', 0.15, 0, i * 0.07)),
    hit: () => tone(200, 0.3, 'sawtooth', 0.2, 60),
    shield: () => tone(800, 0.25, 'triangle', 0.2, 300),
    correct: () => [523, 659, 784].forEach((f, i) => tone(f, 0.15, 'triangle', 0.18, 0, i * 0.09)),
    wrong: () => { tone(300, 0.25, 'square', 0.12, 200); tone(200, 0.35, 'square', 0.12, 120, 0.2); },
    over: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.3, 'triangle', 0.2, 0, i * 0.2))
  })[n]();
}
const MEL = [0,4,7,9,7,4,2,4, 0,4,7,12,9,7,4,2], BASS = [0,-5,-3,-7];
function musicOn() {
  musicOff(); mi = 0;
  musicTimer = setInterval(() => {
    if (!AC) return;
    tone(261.63 * Math.pow(2, MEL[mi % 16] / 12), 0.22, 'triangle', 0.05);
    if (mi % 4 === 0) tone(130.81 * Math.pow(2, BASS[((mi / 4) | 0) % 4] / 12), 0.5, 'sine', 0.08);
    mi++;
  }, 230);
}
function musicOff() { clearInterval(musicTimer); }

// ---------- MENU BUTTONS ----------

// ---------- INPUT ----------
function left() { lane = Math.max(0, lane - 1); }

  if (k === 'ArrowLeft' || k === 'a') left();

let tx = 0, ty = 0, downInPlay = false;
c.addEventListener('pointerdown', e => {

// ---------- UPDATE ----------
function hurt() {
  const hx = PX(lane - 1, 0.88), hy = PY(0.88) - 50;

}
function update(dt) {

  parts = parts.filter(p => p.life > 0);
  if (st !== 'play') { scroll += 0.1 * dt; return; }

  runT += dt;
  speed = 0.22 + 0.5 * (1 - Math.exp(-runT / 70));          // slow start, keeps getting faster
  let target = speed * (slowT > 0 ? 0.55 : 1);
  if (gate || pendingQ) target = Math.min(target * 0.62, 0.22);   // always slow enough to read a question
  curSpd += (target - curSpd) * Math.min(1, dt * 2.5);
  const spd = curSpd;
  scroll += spd * dt;
  runPh += dt * (8 + speed * 16);                             // legs move faster as the game speeds up
  if (slowT > 0) slowT -= dt;
  if (slide > 0) slide -= dt;
  dustT -= dt;
  if (dustT <= 0 && jump === 0) {
    dustT = 0.07;
    parts.push({ x: PX(tl - 1, 0.88) + (Math.random() - .5) * 16, y: PY(0.88), vx: (Math.random() - .5) * 30, vy: -25 - Math.random() * 20, g: 0, life: 0.4, max: 0.4, r: 4 + Math.random() * 3, col: '#e0e0e0' });
  }

  if (jv !== 0 || jump > 0) { jump += jv * dt; jv -= 1800 * dt; if (jump <= 0) { jump = 0; jv = 0; } }
  score += dt * 5;

  spawnT -= dt; gateT -= dt;
  if (!gate && !pendingQ && gateT <= 2.5) pendingQ = makeQ();
  if (!gate && gateT <= 0) { gate = { z: 0.02, ...pendingQ }; pendingQ = null; gateT = 15; }
  else if (!gate && !pendingQ && spawnT <= 0) {
    const r = Math.random();
    items.push({ z: 0.02, l: rand(3), v: rand(3), t: r < 0.45 ? 'ob' : r < 0.6 ? 'low' : r < 0.88 ? 'coin' : r < 0.94 ? 'shield' : 'slow' });
    spawnT = (0.7 + Math.random() * 0.6) * 0.4 / speed;
  }

  for (const it of items) {
    it.z += spd * dt;
    if (!it.done && it.z > 0.82 && it.z < 0.95 && it.l === lane) {

    }

  if (gate) {
    gate.z += spd * dt;

  x.save(); x.translate(px, gy - jh);
  if (sl > 0) x.scale(k * 1.25, k * 0.55); else { x.scale(k, k); x.rotate((lane - tl) * 0.2); }
  if (I) { x.drawImage(I, -55, -115, 110, 115); x.restore(); return; }
  const bob = air ? 0 : -Math.abs(Math.sin(ph)) * 6;
  x.lineCap = 'round'; x.lineJoin = 'round';
  const seg = (x0, y0, x1, y1, w, col) => { x.strokeStyle = col; x.lineWidth = w; x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); };
  // legs: knees bend and the foot kicks up as each leg swings through
  [-1, 1].forEach(sd => {
    const p = ph + (sd < 0 ? 0 : Math.PI), lift = air ? (sd < 0 ? 20 : 4) : Math.max(0, Math.sin(p)) * 28;
    const hx = sd * 8, hy = -42 + bob, fx = sd * 9, fy = -4 - lift;
    const kx = sd * (13 + lift * 0.15), ky = (hy + fy) / 2 - lift * 0.25;
    seg(hx, hy, kx, ky, 14, '#37474f');
    seg(kx, ky, fx, fy, 11, '#f0b97a');
    x.fillStyle = '#fafafa'; x.beginPath(); x.ellipse(fx, fy + 2, 9, 5 + lift * 0.08, 0, 0, 7); x.fill();
    x.fillStyle = '#e53935'; x.fillRect(fx - 8, fy + 3, 16, 2);
  });
  // upper body sways with every stride
  x.save(); x.translate(0, -42 + bob); x.rotate(air ? 0 : Math.sin(ph) * 0.07); x.translate(0, 42 - bob);
  [-1, 1].forEach(sd => {
    const sn = air ? (sd < 0 ? -1 : 1) : Math.sin(ph + (sd < 0 ? Math.PI : 0));
    const sx = sd * 20, sy = -78 + bob, ex = sd * 29, ey = -66 + bob + sn * 5, ax = sd * 25, ay = -50 + bob - sn * 16;
    seg(sx, sy, ex, ey, 10, '#e53935');
    seg(ex, ey, ax, ay, 8, '#f0b97a');
    x.fillStyle = '#f0b97a'; x.beginPath(); x.arc(ax, ay, 5, 0, 7); x.fill();
  });
  rr(-17, -84 + bob, 34, 46, 10, '#e53935');
  rr(-14, -79 + bob, 28, 36, 8, '#1e88e5', '#0d47a1', 2);
  x.fillStyle = '#ffca28'; x.fillRect(-9, -62 + bob, 18, 7);
  const hb = air ? 0 : Math.sin(ph * 2) * 1.5;
  x.fillStyle = '#2b1b17'; x.beginPath(); x.arc(0, -97 + bob + hb, 15, 0, 7); x.fill();
  x.fillStyle = '#d32f2f'; x.beginPath(); x.arc(0, -99 + bob + hb, 15.5, Math.PI, 0); x.fill(); x.fillRect(-15.5, -100 + bob + hb, 31, 4);
  x.restore(); x.restore();
}
function drawEntities() {
  const sorted = [...items].sort((a, b) => a.z - b.z);
  sorted.filter(i => i.z <= 0.88).forEach(drawItem);
  if (gate) drawGate();
  const pz = 0.88, ppx = PX(tl - 1, pz), pgy = PY(pz);
  drawPlayer(ppx, pgy, jump, slide);
  if (shield) {
    const cy = pgy - jump - 55, g = x.createRadialGradient(ppx, cy, 20, ppx, cy, 66);
    g.addColorStop(0, 'rgba(0,229,255,.05)'); g.addColorStop(1, 'rgba(0,229,255,.45)');
    x.fillStyle = g; x.beginPath(); x.arc(ppx, cy, 66, 0, 7); x.fill();
    x.strokeStyle = 'rgba(255,255,255,.8)'; x.lineWidth = 3; x.stroke();
  }
  sorted.filter(i => i.z > 0.88).forEach(drawItem);
}

// ---------- HUD + menus ----------
function drawButton(b) {
  const top = b.go ? ['#66bb6a', '#2e7d32'] : b.sel ? ['#ffe082', '#ffa000'] : ['#5c6bc0', '#303f9f'];
  rr(b.x, b.y + 5, b.w, b.h, 16, 'rgba(0,0,0,.45)');
  rr(b.x, b.y, b.w, b.h, 16, vgrad(b.y, b.y + b.h, top[0], top[1]), b.sel ? '#fff' : 'rgba(255,255,255,.55)', 3);
  text(b.label, b.x + b.w / 2, b.y + b.h / 2, b.go ? 34 : 23, '#fff');
}
function drawHUD() {
  if (st === 'play' && speed > 0.38) {
    x.strokeStyle = `rgba(255,255,255,${Math.min(.35, (speed - .38) * 1.2)})`; x.lineWidth = 2;
    for (let i = 0; i < 10; i++) {
      const z = BZ((gt * 2.2 + i * 0.37) % 1), b = (i % 2 ? 1 : -1) * (1.9 + (i % 5) * 0.25);
      x.beginPath(); x.moveTo(PX(b, z), PY(z)); x.lineTo(PX(b, z * 1.12), PY(z * 1.12)); x.stroke();
    }
  }
  const vg = x.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .75);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.3)');
  x.fillStyle = vg; x.fillRect(0, 0, W, H);
  if (flash > 0) { x.fillStyle = `rgba(255,30,30,${Math.min(.5, flash * 1.6)})`; x.fillRect(0, 0, W, H); }
  if (st === 'play') {
    rr(12, 10, 130, 42, 21, 'rgba(0,0,0,.45)', 'rgba(255,255,255,.35)');
    text('❤️'.repeat(Math.max(0, lives)) + '🖤'.repeat(Math.max(0, 3 - lives)), 77, 32, 24);
    rr(W - 172, 10, 160, 42, 21, 'rgba(0,0,0,.45)', '#ffd54f');
    text('⭐ ' + Math.floor(score), W - 92, 32, 24, '#ffe082');
    const q = gate || pendingQ;
    if (q) {
      rr(18, 62, W - 36, 92, 18, vgrad(62, 154, 'rgba(25,40,100,.92)', 'rgba(10,20,60,.92)'), '#ffd54f', 3);
      text(gate ? 'QUESTION' : 'GET READY!', W / 2, 78, 14, gate ? '#90caf9' : '#ff8a65');
      fitText(q.q, W / 2, 120, W - 70, 34, '#fff');
    }
    if (msgT > 0) fitText(msg, W / 2, 205, W - 40, 40, msgOk ? '#69f0ae' : '#ff8a80');
    if (shield) emoji('🛡️', 30, H - 48, 30);
    if (slowT > 0) text('⏳ ' + Math.ceil(slowT), 62, H - 48, 22, '#80deea', 'left');
    const cn = CATS.find(v => v[0] === sel.cat)[1], ln = LVLS.find(v => v[0] === sel.lvl)[1];
    text(cn + ' • ' + ln, W / 2, H - 18, 18, 'rgba(255,255,255,.9)');
  } else {
    x.fillStyle = vgrad(0, H, 'rgba(10,20,60,.82)', 'rgba(0,0,0,.9)'); x.fillRect(0, 0, W, H);
    if (st === 'menu') {
      const bounce = Math.sin(gt * 3) * 4;
      text('QUIZ', W / 2, 60 + bounce, 64, '#ffd54f');
      text('RUNNER', W / 2, 120 + bounce, 46, '#fff');
      text('Subject', W / 2, 185, 24, '#ffd54f');
      text('Level', W / 2, 365, 24, '#ffd54f');
      text('Best score: ' + best, W / 2, 665, 26);
      text('Run into the lane with the right answer!', W / 2, 705, 20, '#ccc');
      text('← → move    ↑ jump    ↓ slide', W / 2, 738, 20, '#ccc');
      text('🛡️ shield    ⏳ slow-mo    (M = mute)', W / 2, 768, 18, '#ccc');
    } else {
      text('Game Over', W / 2, 60, 50);
      text('Score ' + Math.floor(score) + '   (Best ' + best + ')', W / 2, 120, 30, '#ffd54f');
      text('Answered right: ' + stats.ok + ' / ' + stats.n, W / 2, 165, 24);
      text('📝 Review', W / 2, 225, 26, '#ffd54f');
      if (!missed.length) text(stats.n ? 'Perfect! No missed questions 🎉' : 'No questions answered yet', W / 2, 300, 22, '#69f0ae');
      missed.slice(0, 4).forEach((m, i) => {
        const y = 270 + i * 90, cut = t => t.length > 34 ? t.slice(0, 33) + '…' : t;
        text(cut(m.q), W / 2, y, 20, '#fff');
        text('✔ ' + cut(m.ans), W / 2, y + 28, 24, '#69f0ae');
        text('you chose: ' + cut(m.pick), W / 2, y + 54, 16, '#ff8a80');
      });
      if (missed.length > 4) text('+' + (missed.length - 4) + ' more', W / 2, 622, 18, '#ccc');
    }
    buttons().forEach(drawButton);
  }
  text(muted ? '🔇' : '🔊', W - 38, H - 38, 30);
}
function draw() {
  x.save();
  if (shake > 0) x.translate((Math.random() - .5) * 10, (Math.random() - .5) * 10);
  drawWorld(); drawEntities();
  x.restore();
  drawParts(); drawHUD();
}

let last = performance.now();
(function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
})(last);
</script>
