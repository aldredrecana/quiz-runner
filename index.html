function genMath(lvl) {
  let a, b, q, ans;
  const alt = Math.random() < 0.3 ? rand(2) : -1;
  if (alt === 0) { const m = [10, 30, 60][lvl - 1]; a = 1 + rand(m); b = 1 + rand(m); q = `${a} + ? = ${a + b}`; ans = b; }
  else if (alt === 1) { const d = [1 + rand(3), 2 + rand(9), 5 + rand(21)][lvl - 1], s0 = 1 + rand(lvl * 10); q = `${s0}, ${s0 + d}, ${s0 + 2 * d}, ?`; ans = s0 + 3 * d; }
  else if (lvl === 1) {
    a = 1 + rand(10); b = 1 + rand(10);
    if (rand(2)) { q = `${a} + ${b}`; ans = a + b; }
    else { const hi = Math.max(a, b), lo = Math.min(a, b); q = `${hi} − ${lo}`; ans = hi - lo; }
  } else if (lvl === 2) {
    const op = rand(3);
    if (op === 0) { a = 10 + rand(40); b = 5 + rand(40); q = `${a} + ${b}`; ans = a + b; }
    else if (op === 1) { a = 20 + rand(30); b = 1 + rand(19); q = `${a} − ${b}`; ans = a - b; }
    else { a = 2 + rand(9); b = 2 + rand(9); q = `${a} × ${b}`; ans = a * b; }
  } else {
    const op = rand(3);
    if (op === 0) { a = 3 + rand(10); b = 3 + rand(10); q = `${a} × ${b}`; ans = a * b; }
    else if (op === 1) { b = 2 + rand(10); ans = 2 + rand(11); a = b * ans; q = `${a} ÷ ${b}`; }
    else { a = 40 + rand(60); b = 20 + rand(60); q = `${a} + ${b}`; ans = a + b; }
  }
  const spread = lvl === 1 ? 3 : lvl === 2 ? 6 : 10;
  const w = new Set();
  while (w.size < 2) { const v = ans + rand(spread * 2 + 1) - spread; if (v !== ans && v >= 0) w.add(v); }
  return { q: alt >= 0 ? q : q + ' = ?', ans: String(ans), wrong: [...w].map(String) };
}

function makeQ() {
  let r;
  for (let tries = 0; tries < 15; tries++) {
    const cat = sel.cat === 'mixed' ? ['math','filipino','english','science','ph'][rand(5)] : sel.cat;
    const pool = cat === 'math' ? [] : BANK.filter(e => e[0] === cat && e[1] === sel.lvl);
    if (!pool.length) r = genMath(sel.lvl);
    else { const e = pool[rand(pool.length)]; r = { q: e[2], ans: e[3], wrong: [e[4], e[5]] }; }
    if (!recent.includes(r.q)) break;
  }
  recent.push(r.q); if (recent.length > 30) recent.shift();
  const opts = shuffle([r.ans, ...r.wrong]);
  return { q: r.q, ans: r.ans, opts, idx: opts.indexOf(r.ans) };
}

let AC = null, master = null, muted = localStorage.getItem('qr_mute') === '1', musicTimer = null, mi = 0;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = muted ? 0 : 1; master.connect(AC.destination);
  } catch (e) {}
}
function toggleMute() {
  muted = !muted; try { localStorage.setItem('qr_mute', muted ? '1' : '0'); } catch (e) {}
  audioInit(); if (master) master.gain.value = muted ? 0 : 1;
}
function tone(f, d, type, vol, f2, delay) {
  if (!AC) return;
  const t = AC.currentTime + (delay || 0), o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'square'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
  g.gain.setValueAtTime(vol || 0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.02);
}
function sfx(n) {
  ({
    jump: () => tone(300, 0.18, 'square', 0.1, 600),
    tap: () => tone(660, 0.08, 'triangle', 0.15, 880),
    slide: () => tone(400, 0.2, 'sawtooth', 0.08, 150),
    coin: () => { tone(988, 0.08, 'square', 0.1); tone(1319, 0.15, 'square', 0.1, 0, 0.07); },
    power: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.12, 'triangle', 0.15, 0, i * 0.07)),
    hit: () => tone(200, 0.3, 'sawtooth', 0.2, 60),
    shield: () => tone(800, 0.25, 'triangle', 0.2, 300),
    correct: () => [523, 659, 784].forEach((f, i) => tone(f, 0.15, 'triangle', 0.18, 0, i * 0.09)),
    wrong: () => { tone(300, 0.25, 'square', 0.12, 200); tone(200, 0.35, 'square', 0.12, 120, 0.2); },
    over: () => [392, 330, 262, 196].forEach((f, i) => tone(f, 0.3, 'triangle', 0.2, 0, i * 0.2))
  })[n]();
}
const MEL = [0,4,7,9,7,4,2,4, 0,4,7,12,9,7,4,2], BASS = [0,-5,-3,-7];
function musicOn() {
  musicOff(); mi = 0;

  }

  }

  rr(px - w / 2, cy - h / 2, w, h, 5 * z, null, '#212121', Math.max(1, 3 * z));

}
function drawItem(it) {
  const z = it.z, px = PX(it.l - 1, z), gy = PY(z), s = 95 * z;
  if (it.t === 'low') return drawLow(px, gy, z);

    } else {
      x.fillStyle = '#ff6d00'; x.beginPath(); x.moveTo(px - s * .3, gy); x.lineTo(px + s * .3, gy); x.lineTo(px + s * .08, gy - s * .8); x.lineTo(px - s * .08, gy - s * .8); x.fill();
      x.fillStyle = '#fff'; x.fillRect(px - s * .19, gy - s * .42, s * .38, s * .12);
      x.fillStyle = '#bf360c'; x.fillRect(px - s * .36, gy - s * .06, s * .72, s * .08);
    }

  }
  const bob = Math.sin(gt * 4 + it.l * 2) * s * 0.06;
  if (it.t === 'coin') {
    const I = im('coin'), cy = gy - s * .55 + bob, w = Math.max(s * .1, s * .55 * Math.abs(Math.cos(gt * 5 + it.l)));

    x.fillStyle = '#ffb300'; x.beginPath(); x.ellipse(px, cy, w, s * .3, 0, 0, 7); x.fill();
    x.fillStyle = '#ffe082'; x.beginPath(); x.ellipse(px, cy, w * .72, s * .22, 0, 0, 7); x.fill();
    x.fillStyle = '#ffb300'; x.fillRect(px - w * .1, cy - s * .12, Math.max(1, w * .2), s * .24);
    return;
  }
  const col = it.t === 'shield' ? '#00e5ff' : '#b388ff', cy = gy - s * .6 + bob;
  shadow(px, gy, s * .3);
  const g = x.createRadialGradient(px, cy, s * .05, px, cy, s * .5);
  g.addColorStop(0, 'rgba(255,255,255,.9)'); g.addColorStop(.6, col); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.beginPath(); x.arc(px, cy, s * .5, 0, 7); x.fill();
  const I = im(it.t);
  if (I) x.drawImage(I, px - s * .3, cy - s * .3, s * .6, s * .6); else emoji(it.t === 'shield' ? '🛡️' : '⏳', px, cy, s * .5);
}
function drawGate() {
  const z = gate.z, w = SP * 0.92 * z, h = 110 * z, gy = PY(z), top = gy - 205 * z, post = 14 * z;
  const cols = [['#ff6b6b', '#c62828'], ['#4dabff', '#1565c0'], ['#ffd54f', '#f9a825']], L = ['A', 'B', 'C'];
  const mats = ['rgba(255,82,82,.35)', 'rgba(33,150,243,.35)', 'rgba(255,213,79,.4)'];
  for (let i = 0; i < 3; i++) quad(i - 1 - .46, i - 1 + .46, zOf(gate.d + 5), z, mats[i]);
  x.fillStyle = '#37474f'; x.fillRect(PX(-1.5, z) - post, top, post, gy - top); x.fillRect(PX(1.5, z), top, post, gy - top);
  rr(PX(-1.5, z) - post, top - 6 * z, PX(1.5, z) - PX(-1.5, z) + 2 * post, 24 * z, 6 * z, '#455a64', '#fff', Math.max(1, 2 * z));
  for (let i = 0; i < 3; i++) {
    const px = PX(i - 1, z), by = gy - 150 * z;

    x.fillStyle = '#fff'; x.beginPath(); x.arc(px - w / 2 + 16 * z, by + 16 * z, 12 * z, 0, 7); x.fill();
    x.font = `bold ${Math.max(8, 15 * z)}px ${FONT}`; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillStyle = cols[i][1]; x.fillText(L[i], px - w / 2 + 16 * z, by + 17 * z);

}
function drawPlayer(px, gy, jh, sl) {
  const I = im('player'), k = 0.9, air = jh > 0, ph = air ? 0 : runPh;
  shadow(px, gy, 30 * (1 - Math.min(jh, 140) / 280));
  x.save(); x.translate(px, gy - jh);
  if (sl > 0) x.scale(k * 1.25, k * 0.55); else { x.scale(k, k); x.rotate((lane - tl) * 0.2); }
  if (I) { x.drawImage(I, -55, -115, 110, 115); x.restore(); return; }
  const bob = air ? 0 : -Math.abs(Math.sin(ph)) * 6;
  x.lineCap = 'round'; x.lineJoin = 'round';
  const seg = (x0, y0, x1, y1, w, col) => { x.strokeStyle = col; x.lineWidth = w; x.beginPath(); x.moveTo(x0, y0); x.lineTo(x1, y1); x.stroke(); };
  // legs: knees bend and the foot kicks up as each leg swings through
  [-1, 1].forEach(sd => {
    const p = ph + (sd < 0 ? 0 : Math.PI), lift = air ? (sd < 0 ? 20 : 4) : Math.max(0, Math.sin(p)) * 28;
    const hx = sd * 8, hy = -42 + bob, fx = sd * 9, fy = -4 - lift;
    const kx = sd * (13 + lift * 0.15), ky = (hy + fy) / 2 - lift * 0.25;
    seg(hx, hy, kx, ky, 14, '#37474f');
    seg(kx, ky, fx, fy, 11, '#f0b97a');
    x.fillStyle = '#fafafa'; x.beginPath(); x.ellipse(fx, fy + 2, 9, 5 + lift * 0.08, 0, 0, 7); x.fill();
    x.fillStyle = '#e53935'; x.fillRect(fx - 8, fy + 3, 16, 2);
  });
  // upper body sways with every stride
  x.save(); x.translate(0, -42 + bob); x.rotate(air ? 0 : Math.sin(ph) * 0.07); x.translate(0, 42 - bob);
  [-1, 1].forEach(sd => {
    const sn = air ? (sd < 0 ? -1 : 1) : Math.sin(ph + (sd < 0 ? Math.PI : 0));
    const sx = sd * 20, sy = -78 + bob, ex = sd * 29, ey = -66 + bob + sn * 5, ax = sd * 25, ay = -50 + bob - sn * 16;
    seg(sx, sy, ex, ey, 10, '#e53935');
    seg(ex, ey, ax, ay, 8, '#f0b97a');
    x.fillStyle = '#f0b97a'; x.beginPath(); x.arc(ax, ay, 5, 0, 7); x.fill();
  });
  rr(-17, -84 + bob, 34, 46, 10, '#e53935');
  rr(-14, -79 + bob, 28, 36, 8, '#1e88e5', '#0d47a1', 2);
  x.fillStyle = '#ffca28'; x.fillRect(-9, -62 + bob, 18, 7);
  const hb = air ? 0 : Math.sin(ph * 2) * 1.5;
  x.fillStyle = '#2b1b17'; x.beginPath(); x.arc(0, -97 + bob + hb, 15, 0, 7); x.fill();
  x.fillStyle = '#d32f2f'; x.beginPath(); x.arc(0, -99 + bob + hb, 15.5, Math.PI, 0); x.fill(); x.fillRect(-15.5, -100 + bob + hb, 31, 4);
  x.restore(); x.restore();
}
function drawFaded(it) { x.globalAlpha = Math.min(1, Math.max(0, (it.z - 0.06) / 0.06)); drawItem(it); x.globalAlpha = 1; }
function drawEntities() {
  const live = st === 'play' || st === 'pause', sorted = live ? [...items].sort((a, b) => a.z - b.z) : [];
  sorted.filter(i => i.z <= 0.88).forEach(drawFaded);
  if (gate && live) { x.globalAlpha = Math.min(1, Math.max(0, (gate.z - 0.09) / 0.05)); drawGate(); x.globalAlpha = 1; }
  const pz = 0.88, ppx = PX(tl - 1, pz), pgy = PY(pz);

// ---------- HUD + menus ----------
const PRAISE = ['Great job! 🎉', 'Awesome! ⭐', 'You got it! 👏', 'Super! 🌟', 'Yay! 🎈'];
function star(cx, cy, r, col) {
  x.fillStyle = col; x.strokeStyle = 'rgba(0,0,0,.35)'; x.lineWidth = 3; x.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rad = i % 2 ? r * 0.45 : r; x.lineTo(cx + Math.cos(a) * rad, cy + Math.sin(a) * rad); }
  x.closePath(); x.fill(); x.stroke();
}
function rainbow(str, cx, cy, size) {
  const cols = ['#ff5252', '#ff9800', '#ffd54f', '#69f0ae', '#40c4ff', '#b388ff'], chars = [...str];
  x.font = `bold ${size}px ${FONT}`;
  const ws = chars.map(ch => x.measureText(ch).width), total = ws.reduce((a, b) => a + b, 0);
  let px = cx - total / 2;
  chars.forEach((ch, i) => { text(ch, px + ws[i] / 2, cy + Math.sin(gt * 4 + i * 0.6) * 5, size, cols[i % cols.length]); px += ws[i]; });
}
function panel(px, py, w, h) {
  rr(px, py + 6, w, h, 22, 'rgba(0,0,0,.35)');
  rr(px, py, w, h, 22, vgrad(py, py + h, 'rgba(40,60,140,.94)', 'rgba(20,30,90,.94)'), '#ffd54f', 4);
}
function roundBtn(cx, cy, r, top, bot) {
  x.fillStyle = 'rgba(0,0,0,.35)'; x.beginPath(); x.arc(cx, cy + 3, r, 0, 7); x.fill();
  x.fillStyle = vgrad(cy - r, cy + r, top, bot); x.beginPath(); x.arc(cx, cy, r, 0, 7); x.fill();
  x.strokeStyle = '#fff'; x.lineWidth = 3; x.stroke();
}
function drawButton(b) {
  const pul = b.pulse ? 1 + Math.sin(gt * 5) * 0.025 : (b.sel ? 1 + Math.sin(gt * 6) * 0.02 : 1);
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2, rad = b.round ? 27 : 20;
  x.save(); x.translate(cx, cy); x.scale(pul, pul); x.translate(-cx, -cy);

  rr(b.x, b.y + 6, b.w, b.h, rad, 'rgba(0,0,0,.4)');
  rr(b.x, b.y, b.w, b.h, rad, vgrad(b.y, b.y + b.h, b.top, b.bot), b.sel ? '#fff' : 'rgba(255,255,255,.6)', b.sel ? 5 : 3);
  rr(b.x + 8, b.y + 5, b.w - 16, b.h * 0.26, 12, 'rgba(255,255,255,.28)');

  else fitText(b.label, cx, cy, b.w - 16, b.fs || (b.go ? 36 : 28), '#fff');
  if (b.sel) { x.fillStyle = '#fff'; x.beginPath(); x.arc(b.x + b.w - 14, b.y + 14, 11, 0, 7); x.fill(); text('✓', b.x + b.w - 14, b.y + 15, 15, '#2e7d32'); }
  x.restore();
}
function drawHUD() {
  if (st === 'play' && speed > 0.38) {
    x.strokeStyle = `rgba(255,255,255,${Math.min(.35, (speed - .38) * 1.2)})`; x.lineWidth = 2;
    for (let i = 0; i < 10; i++) {
      const z = BZ((gt * 2.2 + i * 0.37) % 1), b = (i % 2 ? 1 : -1) * (1.9 + (i % 5) * 0.25);
      x.beginPath(); x.moveTo(PX(b, z), PY(z)); x.lineTo(PX(b, z * 1.12), PY(z * 1.12)); x.stroke();

  }

      fitText(q.q, W / 2, 111, W - 70, 28, '#fff');

        x.fillStyle = '#fff'; x.beginPath(); x.arc(cx + 17, 166, 12, 0, 7); x.fill(); text('ABC'[i], cx + 17, 167, 15, ccol[i]);

    text('🏆 Best score', 340, 700, 20, '#fff');
    text('⭐ ' + getBest(), 340, 741, 38, '#ffe082');
  } else if (st === 'over') {
    x.fillStyle = 'rgba(10,20,70,.6)'; x.fillRect(0, 0, W, H);

    text(stars === 3 ? 'Amazing run!' : stars === 2 ? 'Great run!' : 'Nice try!', W / 2, 58, 48, '#ffd54f');

    text('Right answers: ' + stats.ok + ' / ' + stats.n + '   •   Best: ' + getBest(), W / 2, 240, 19, '#cfd8ff');

  } else if (st === 'help') {

      ['🧠', 'Read the question, then run into the lane with the right answer!'], ['🔥', 'Collect coins! Streaks of right answers earn extra hearts ❤️'], ['🛡️ ⏳', 'Shield saves you once. Slow-mo gives you more time!']];
    rows.forEach((r, i) => {

  if (st !== 'play' && st !== 'pause') buttons().forEach(drawButton);

  roundBtn(ms[0], ms[1], st === 'play' ? 24 : 26, '#4fc3f7', '#0277bd');

}

function draw() {
  x.setTransform(DPR, 0, 0, DPR, 0, 0);
  x.save();
  if (shake > 0) x.translate((Math.random() - .5) * 10, (Math.random() - .5) * 10);
  drawWorld(); drawEntities();
  x.restore();
  drawParts(); drawHUD();
}

let last = performance.now();
(function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt); draw(); requestAnimationFrame(loop);
})(last);
